<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" role="img" aria-labelledby="title desc">
  <title id="title">Terminal intro panel</title>
  <desc id="desc">A refined terminal-style top panel with attached title bar, dimensional window controls, and terminal identity text.</desc>

  <defs>
    <!-- warm cream title bar: three-stop for gentle tonal range -->
    <linearGradient id="barFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d9d3ca"/>
      <stop offset="55%"  stop-color="#cfc8be"/>
      <stop offset="100%" stop-color="#c4bdb2"/>
    </linearGradient>

    <!-- body: three-stop to match the bottom panel for visual continuity -->
    <linearGradient id="bodyFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#121a24"/>
      <stop offset="55%"  stop-color="#0f161f"/>
      <stop offset="100%" stop-color="#0c1219"/>
    </linearGradient>

    <linearGradient id="topGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- thin inner shadow just below the title bar so it reads as attached chrome -->
    <linearGradient id="underBarShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bottomBlend" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0c1219" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0c1219" stop-opacity="0"/>
    </linearGradient>

    <!-- traffic-light radial gradients: off-center light source for subtle volume -->
    <radialGradient id="dotRed" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0%"   stop-color="#f58a7f"/>
      <stop offset="100%" stop-color="#d95245"/>
    </radialGradient>
    <radialGradient id="dotYellow" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0%"   stop-color="#ecc269"/>
      <stop offset="100%" stop-color="#c79635"/>
    </radialGradient>
    <radialGradient id="dotGreen" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0%"   stop-color="#7dcf85"/>
      <stop offset="100%" stop-color="#3ea34f"/>
    </radialGradient>

    <!-- warm amber gradient for the name: muted, dimensional, not neon -->
    <linearGradient id="nameAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f6c986"/>
      <stop offset="100%" stop-color="#e0a860"/>
    </linearGradient>

    <!-- shape inset by exactly 6px on both sides to match the pixel art border -->
    <path id="panelShape" d="
      M 22 0
      H 1178
      Q 1194 0 1194 16
      V 160
      H 6
      V 16
      Q 6 0 22 0
      Z
    " />
  </defs>

  <!-- unified outer body with flat bottom -->
  <use href="#panelShape" fill="url(#bodyFill)"/>

  <!-- title bar (rounded top) -->
  <rect
    x="6"
    y="0"
    width="1188"
    height="32"
    rx="16"
    fill="url(#barFill)"
    stroke="#b5ada1"
    stroke-opacity="0.9"
  />

  <!-- flatten lower corners of title bar so it feels attached to the body -->
  <rect x="6" y="16" width="1188" height="16" fill="url(#barFill)"/>

  <!-- soft top inner highlight on the title bar -->
  <rect x="7" y="1" width="1186" height="10" rx="15" fill="url(#topGlow)"/>

  <!-- hairline mid-bar gloss, very subtle -->
  <line x1="24" y1="16" x2="1176" y2="16" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- window dots: radial-gradient fills + whisper stroke for definition -->
  <circle cx="30" cy="16" r="5.5" fill="url(#dotRed)"    stroke="#000000" stroke-opacity="0.18" stroke-width="0.5"/>
  <circle cx="50" cy="16" r="5.5" fill="url(#dotYellow)" stroke="#000000" stroke-opacity="0.18" stroke-width="0.5"/>
  <circle cx="70" cy="16" r="5.5" fill="url(#dotGreen)"  stroke="#000000" stroke-opacity="0.18" stroke-width="0.5"/>

  <!-- tiny specular highlights on each dot for dimensional polish -->
  <ellipse cx="28.4" cy="14.2" rx="1.6" ry="1.1" fill="#ffffff" fill-opacity="0.35"/>
  <ellipse cx="48.4" cy="14.2" rx="1.6" ry="1.1" fill="#ffffff" fill-opacity="0.30"/>
  <ellipse cx="68.4" cy="14.2" rx="1.6" ry="1.1" fill="#ffffff" fill-opacity="0.30"/>

  <!-- centered title -->
  <text
    x="600"
    y="20.5"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="13"
    letter-spacing="0.5"
    fill="#5a534a"
  >Github_Profile.txt</text>

  <!-- seam under title bar -->
  <line x1="6" y1="32" x2="1194" y2="32" stroke="#6a6156" stroke-opacity="0.55"/>

  <!-- inner shadow under the bar: sells the attached-chrome impression -->
  <rect x="6" y="32" width="1188" height="6" fill="url(#underBarShadow)"/>

  <!-- terminal prompt line: dim caret, warm amber name, subtle static cursor block -->
  <text
    x="48"
    y="96"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="26"
    letter-spacing="0"
  ><tspan fill="#7d8694">&gt;</tspan><tspan fill="url(#nameAccent)" dx="10">Aditya Khetarpal</tspan></text>

  <!-- steady cursor block: classic terminal polish, muted amber so it doesn't shout -->
  <rect x="334" y="76" width="11" height="22" rx="1" fill="#e0b06a" fill-opacity="0.78"/>

  <!-- subtitle: tag + dim separator + domain -->
  <text
    x="48"
    y="124"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="14"
    letter-spacing="0.2"
  ><tspan fill="#a4afbb">Software Engineer(AI)</tspan><tspan fill="#4a5260" dx="8">·</tspan><tspan fill="#a4afbb" dx="8">Edge-to-Cloud Platforms</tspan></text>

  <!-- subtle fade so the bottom feels open into the scene below -->
  <rect x="6" y="144" width="1188" height="16" fill="url(#bottomBlend)"/>
</svg>
